name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Project
        run: |
          flutter create --org com.voiceapp my_app --platforms=android
          if [ -f "main.dart" ]; then
            cp main.dart my_app/lib/main.dart
          fi
          cd my_app
          flutter pub add speech_to_text
          flutter build apk --release

          # キーの自動生成とAPKへのデジタル署名（OUKITEL等でのブロック防止）
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -dname "CN=Developer, OU=Dev, O=App, L=City, S=State, C=JP" -storepass password -keypass password
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks -storepass password build/app/outputs/flutter-apk/app-release.apk my-key-alias

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
